<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mortem Club — Murder mysteries for your living room</title><link rel="icon" href="assets/icon.png">
<style>@font-face{font-family:Shrikhand;src:url(assets/shrikhand-latin-400-normal.woff2)}
@font-face{font-family:Righteous;src:url(assets/righteous-latin-400-normal.woff2)}
@font-face{font-family:Fraunces;src:url(assets/fraunces-latin-400-normal.woff2)}
@font-face{font-family:Fraunces;src:url(assets/fraunces-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:"DM Sans";src:url(assets/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:"Special Elite";src:url(assets/special-elite-latin-400-normal.woff2)}
:root{--esp:#24150E;--rust:#B4451F;--orange:#E07B24;--mus:#E8B23A;--cream:#F4EAD5}
*{box-sizing:border-box}body{margin:0;background:var(--esp);color:var(--cream);font-family:"DM Sans",sans-serif;line-height:1.5}
.bar{display:flex;flex-direction:column;height:10px}.bar i{flex:1}.bar i:nth-child(1){background:var(--mus)}.bar i:nth-child(2){background:var(--orange)}.bar i:nth-child(3){background:var(--rust)}
main{max-width:640px;margin:0 auto;padding:28px 20px 48px}
.logo{display:block;width:180px;margin:0 auto 20px}
.tag{display:inline-block;font:13px Righteous;letter-spacing:.2em;text-transform:uppercase;background:var(--rust);color:var(--cream);padding:4px 12px;border-radius:99px}
h1{font:400 40px/1.05 Shrikhand;margin:12px 0 6px;color:var(--cream);text-shadow:3px 3px 0 var(--rust)}
.sub{font:italic 18px Fraunces;color:var(--mus);margin:0 0 22px}
.img{width:100%;border-radius:12px;display:block;margin-bottom:18px}
audio{width:100%;margin:6px 0 4px}
.note{font-size:13px;color:#cbb;margin:0 0 26px}
.tr{background:#FBFAF5;color:#2A1D16;border-radius:10px;padding:20px 22px;font:15px/1.6 "Special Elite"}
.tr h2{font:13px Righteous;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);margin:0 0 10px}
.tr p{margin:0 0 10px}.tr em{color:#777;font-style:normal}
details summary{cursor:pointer;font:15px Righteous;letter-spacing:.1em;color:var(--mus);margin-bottom:12px}
footer{text-align:center;font:13px Righteous;letter-spacing:.15em;color:#a98;margin-top:36px}
footer b{font:400 16px Shrikhand;letter-spacing:0;color:var(--orange)} main{text-align:center;padding-top:80px}</style></head><body><div class="bar"><i></i><i></i><i></i></div><main>
<img class="logo" style="width:300px" src="assets/logo_dark.png" alt="Mortem Club">
<p class="sub">Murder mysteries for your living room.</p><p>Coming soon.</p></main></body></html>
